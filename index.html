<style>
:root{--red:#d91e36;--red2:#a91026;--ink:#18202b;--muted:#687386;--bg:#f5f6f8;--line:#e7eaf0;--green:#14945b;--orange:#e68a12;--blue:#2879d0;--shadow:0 8px 26px #18202b0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans Bengali",sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.sidebar{display:none}.main{width:100%;padding-bottom:78px}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:4}.brand{font-weight:800;font-size:21px;color:var(--red);display:flex;gap:10px;align-items:center}.brand i{background:var(--red);color:#fff;border-radius:10px;padding:9px}.top-actions{display:flex;align-items:center;gap:10px}.icon-btn,.avatar{width:38px;height:38px;border-radius:11px;background:#f6f7f9;color:var(--ink);display:grid;place-items:center}.avatar{background:#feecef;color:var(--red);font-weight:800}.content{padding:22px 16px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:20px}.page-head h1{font-size:24px;margin:0 0 5px}.sub{color:var(--muted);margin:0}.btn{background:var(--red);color:#fff;border-radius:10px;padding:11px 15px;font-weight:700;display:inline-flex;align-items:center;gap:8px}.btn:hover{background:var(--red2)}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.green{background:var(--green)}.btn.danger{background:#fff0f1;color:var(--red)}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow);cursor:pointer}.stat .label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:21px;margin:9px 0 2px}.stat i{float:right;color:var(--red);background:#fff0f2;padding:9px;border-radius:10px}.grid2{display:grid;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}.panel h2{font-size:16px;margin:0 0 14px}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.panel-title h2{margin:0}.text-link{color:var(--red);font-weight:700;background:none}.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.mini{border:1px solid var(--line);border-radius:11px;padding:12px}.mini b{font-size:18px;display:block;margin-top:5px}.mini span{color:var(--muted);font-size:12px}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;min-width:550px}.table th,.table td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{color:var(--muted);font-size:12px;font-weight:600}.table td{font-size:13px}.tag{border-radius:30px;padding:5px 9px;font-size:11px;font-weight:700;background:#eef8f3;color:var(--green)}.tag.warn{background:#fff5e5;color:var(--orange)}.tag.danger{background:#fff0f1;color:var(--red)}.actions{display:flex;gap:6px}.actions button{background:#f5f6f8;color:var(--muted);width:30px;height:30px;border-radius:8px}.actions .del{color:var(--red)}.search-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.search{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:8px;flex:1;min-width:180px}.search input{border:0;outline:0;width:100%;background:transparent}.filter{border:1px solid var(--line);background:#fff;padding:10px;border-radius:10px;color:var(--ink)}.empty{text-align:center;padding:38px;color:var(--muted)}.empty i{font-size:35px;color:#cbd1da;margin-bottom:10px}.bottomnav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;z-index:5}.bottomnav button{background:none;color:var(--muted);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 7px}.bottomnav button.active{color:var(--red);font-weight:700}.bottomnav i{font-size:18px}.modal-bg{position:fixed;inset:0;background:#18202b88;display:none;align-items:flex-end;justify-content:center;z-index:10}.modal-bg.open{display:flex}.modal{background:#fff;width:100%;max-height:94vh;overflow:auto;border-radius:19px 19px 0 0;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal h2{margin:0;font-size:19px}.close{background:#f1f3f5;width:32px;height:32px;border-radius:50%}.form-grid{display:grid;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:600}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:11px;outline:0;background:#fff;color:var(--ink)}.field textarea{min-height:70px;resize:vertical}.field input:focus,.field select:focus{border-color:var(--red)}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.toast{position:fixed;right:15px;bottom:82px;background:var(--ink);color:#fff;padding:13px 16px;border-radius:10px;z-index:20;display:none;box-shadow:var(--shadow)}.toast.show{display:block}.hero{background:linear-gradient(120deg,#d91e36,#9f1226);border-radius:17px;color:#fff;padding:20px;margin-bottom:18px}.hero h2{margin:0 0 6px}.hero p{margin:0;color:#ffdce1}.profit{color:var(--green)}.due{color:var(--red)}.cart-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:11px 0}.cart-row .grow{flex:1}.qty{display:flex;align-items:center;gap:8px}.qty button{width:26px;height:26px;border-radius:7px;background:#f0f2f5}.cart-total{display:flex;justify-content:space-between;padding:8px 0}.invoice{font-family:Arial;background:#fff;padding:20px;max-width:700px;margin:auto}.no-print{display:block}@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:repeat(2,1fr)}.modal{max-width:720px;border-radius:18px;margin:20px;max-height:90vh}.modal-bg{align-items:center}.content{padding:28px}.mini-grid{grid-template-columns:repeat(4,1fr)}}@media(min-width:1000px){.sidebar{display:flex;width:245px;background:#fff;border-right:1px solid var(--line);flex-direction:column;padding:25px 14px;position:fixed;top:0;bottom:0}.sidebar .brand{padding:0 12px 28px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:none;text-align:left;padding:13px 14px;border-radius:10px;color:var(--muted);font-weight:600}.nav button.active,.nav button:hover{background:#fff0f2;color:var(--red)}.nav i{width:24px}.main{margin-left:245px;width:calc(100% - 245px);padding-bottom:0}.topbar{padding:0 30px}.bottomnav{display:none}.cards{grid-template-columns:repeat(5,1fr)}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><i class="fa-solid fa-cubes"></i><span id="sideBrand">BizFlow</span></div><nav class="nav" id="sideNav"></nav></aside><main class="main"><header class="topbar"><div class="brand mobile-brand"><i class="fa-solid fa-cubes"></i><span id="mobileBrand">BizFlow</span></div><div class="top-actions"><button class="icon-btn" data-action="global-search" title="Search"><i class="fa-solid fa-magnifying-glass"></i></button><button class="icon-btn" data-action="demo" title="Load demo"><i class="fa-solid fa-wand-magic-sparkles"></i></button><div class="avatar">B</div></div></header><section class="content" id="app"></section></main></div><nav class="bottomnav" id="bottomNav"></nav><div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div><input type="file" id="importFile" accept="application/json" hidden>
<script>
const KEY='bizflow-db-v1', today=()=>new Date().toISOString().slice(0,10), uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7), money=n=>`${db.settings.currency||'৳'}${Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2})}`, date=s=>s?new Date(s).toLocaleDateString('en-GB'):'';
const blank={items:[],sales:[],saleItems:[],expenses:[],companies:[],customers:[],payments:[],stockTransactions:[],invoices:[],settings:{businessName:'BizFlow',ownerName:'',phone:'',address:'',logo:'',currency:'৳',invoicePrefix:'INV',lowStockThreshold:10,theme:'light'}};
let db=load(), view='dashboard', cart=[], editing=null, selectedCompany=null;
function load(){try{return {...blank,...JSON.parse(localStorage.getItem(KEY)||'{}'),settings:{...blank.settings,...(JSON.parse(localStorage.getItem(KEY)||'{}').settings||{})}}}catch(e){return structuredClone(blank)}}function save(){localStorage.setItem(KEY,JSON.stringify(db))}function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2400)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function sum(a,f){return a.reduce((x,y)=>x+Number(f(y)||0),0)}function isToday(x){return (x||'').slice(0,10)===today()}function navItems(){return [['dashboard','Dashboard','fa-chart-pie'],['stock','Stock Management','fa-boxes-stacked'],['sales','Sales / POS','fa-cart-shopping'],['expenses','Expenses','fa-receipt'],['search','Item Search','fa-location-dot'],['due','Due List','fa-building'],['customers','Customers','fa-users'],['reports','Reports','fa-chart-line'],['settings','Settings','fa-gear']]}function nav(){let h=navItems().map(x=>`<button class="${view===x[0]?'active':''}" data-view="${x[0]}"><i class="fa-solid ${x[2]}"></i>${x[1]}</button>`).join('');document.getElementById('sideNav').innerHTML=h;document.getElementById('bottomNav').innerHTML=navItems().slice(0,5).map(x=>`<button class="${view===x[0]?'active':''}" data-view="${x[0]}"><i class="fa-solid ${x[2]}"></i>${x[1].split(' ')[0]}</button>`).join('');document.getElementById('sideBrand').textContent=db.settings.businessName;document.getElementById('mobileBrand').textContent=db.settings.businessName}
function render(){nav();let f={dashboard:dashboard,stock:stock,sales:sales,expenses:expenses,search:searchPage,due:due,customers:customers,reports:reports,settings:settings}[view]||dashboard;document.getElementById('app').innerHTML=f();}
function pageHead(title,sub,btn=''){return `<div class="page-head"><div><h1>${title}</h1><p class="sub">${sub||''}</p></div>${btn}</div>`}function empty(icon='fa-box-open',txt='Nothing here yet'){return `<div class="empty"><i class="fa-solid ${icon}"></i><div>${txt}</div></div>`}
function dashboard(){let sales=sum(db.sales.filter(x=>isToday(x.date)),x=>x.total), exp=sum(db.expenses.filter(x=>isToday(x.date)),x=>x.amount), paid=sum(db.payments.filter(x=>isToday(x.date)),x=>x.amount), due=sum(db.companies,x=>companyDue(x.id)), low=db.items.filter(x=>Number(x.stock)<=Number(x.minimum||db.settings.lowStockThreshold));let stats=[['Total Items',db.items.length,'fa-box'],['Total Stock',sum(db.items,x=>x.stock),'fa-layer-group','stock'],["Today's Sales",money(sales),'fa-chart-line','sales'],["Today's Expenses",money(exp),'fa-receipt','expenses'],["Today's Profit",money(sales-exp),'fa-arrow-trend-up'],['Total Due',money(due),'fa-file-invoice-dollar','due'],['Payments Received',money(paid),'fa-money-bill-wave'],['Low Stock',low.length,'fa-triangle-exclamation','stock'],['Companies',db.companies.length,'fa-building','due'],['Customers',db.customers.length,'fa-users','customers']];let recent=db.sales.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,5);return pageHead(`Good ${new Date().getHours()<12?'morning':'day'} 👋`,`Here is your business overview for ${date(today())}`)+`<div class="hero"><h2>${esc(db.settings.businessName)}</h2><p>Keep your stock, sales and accounts moving forward.</p></div><div class="cards">${stats.map((s,i)=>`<div class="stat" ${s[3]?`data-view="${s[3]}"`:''}><i class="fa-solid ${s[2]}"></i><span class="label">${s[0]}</span><strong class="${i===4?'profit':i===5?'due':''}">${typeof s[1]==='number'?s[1].toLocaleString():s[1]}</strong></div>`).join('')}</div><div class="grid2"><div class="panel"><div class="panel-title"><h2>Today's Summary</h2><button class="text-link" data-view="reports">Reports</button></div><div class="mini-grid"><div class="mini"><span>Sales</span><b>${money(sales)}</b></div><div class="mini"><span>Expenses</span><b>${money(exp)}</b></div><div class="mini"><span>Profit</span><b class="profit">${money(sales-exp)}</b></div><div class="mini"><span>Payments</span><b>${money(paid)}</b></div></div></div><div class="panel"><div class="panel-title"><h2>Low Stock Alert</h2><button class="text-link" data-view="stock">View all</button></div>${low.length?low.slice(0,5).map(x=>`<div class="cart-row"><i class="fa-solid fa-box" style="color:var(--red)"></i><div class="grow"><b>${esc(x.name)}</b><small>${esc(x.code||'No SKU')}</small></div><span class="tag danger">${x.stock} ${x.unit||'pcs'}</span></div>`).join(''):empty('fa-circle-check','Inventory levels look healthy')}</div></div><div class="panel"><div class="panel-title"><h2>Recent Sales</h2><button class="text-link" data-view="sales">View all</button></div>${recent.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Total</th><th>Paid</th><th>Due</th></tr></thead><tbody>${recent.map(x=>`<tr><td><b>${x.invoice}</b></td><td>${esc(x.customerName||'Walk-in')}</td><td>${date(x.date)}</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td class="due">${money(x.due)}</td></tr>`).join('')}</tbody></table></div>`:empty('fa-cart-shopping','No sales recorded yet')}</div>`}
function stock(){let q=(window.stockQ||'').toLowerCase(), arr=db.items.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q));return pageHead('Stock Management','Manage inventory, locations and stock movements.',`<button class="btn" data-action="item-form"><i class="fa-solid fa-plus"></i> Add item</button>`)+`<div class="search-row"><div class="search"><i class="fa-solid fa-search"></i><input data-search="stock" value="${esc(window.stockQ||'')}" placeholder="Search name, SKU, rack, box..."></div><select class="filter" data-filter="stock"><option value="all">All stock</option><option value="low">Low stock</option></select></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Item</th><th>SKU</th><th>Category</th><th>Location</th><th>Stock</th><th>Prices</th><th>Actions</th></tr></thead><tbody>${arr.length?arr.map(x=>`<tr><td><b>${esc(x.name)}</b><br><small>${esc(x.brand||'')}</small></td><td>${esc(x.code||'-')}</td><td>${esc(x.category||'-')}</td><td>${esc(x.box||'-')} / ${esc(x.rack||'-')}<br><small>${esc(x.location||'')}</small></td><td><span class="tag ${Number(x.stock)<=Number(x.minimum||db.settings.lowStockThreshold)?'danger':''}">${x.stock} ${esc(x.unit||'pcs')}</span></td><td>${money(x.purchase)} / ${money(x.selling)}</td><td><div class="actions"><button data-action="stock-add" data-id="${x.id}" title="Add stock"><i class="fa-solid fa-plus"></i></button><button data-action="item-edit" data-id="${x.id}"><i class="fa-solid fa-pen"></i></button><button class="del" data-action="item-delete" data-id="${x.id}"><i class="fa-solid fa-trash"></i></button></div></td></tr>`).join(''): `<tr><td colspan="7">${empty('fa-box-open','No items found')}</td></tr>`}</tbody></table></div></div>`}
function sales(){return pageHead('Sales / POS','Create invoices and collect payments.',`<button class="btn" data-action="clear-cart"><i class="fa-solid fa-rotate-left"></i> New sale</button>`)+`<div class="grid2"><div class="panel"><div class="panel-title"><h2>Products</h2><span class="sub">${db.items.length} items</span></div><div class="search"><i class="fa-solid fa-search"></i><input data-search="pos" value="${esc(window.posQ||'')}" placeholder="Search item to add..."></div><div style="margin-top:10px">${db.items.filter(x=>!window.posQ||Object.values(x).join(' ').toLowerCase().includes(window.posQ.toLowerCase())).slice(0,8).map(x=>`<div class="cart-row"><div class="grow"><b>${esc(x.name)}</b><small>${money(x.selling)} · Stock ${x.stock}</small></div><button class="btn" style="padding:7px 10px" data-action="cart-add" data-id="${x.id}" ${x.stock<1?'disabled':''}><i class="fa-solid fa-plus"></i></button></div>`).join('')||empty('fa-box','No matching items')}</div></div><div class="panel"><h2>Current cart</h2>${cart.length?cart.map((c,i)=>`<div class="cart-row"><div class="grow"><b>${esc(c.name)}</b><br><small>${money(c.price)} each</small></div><div class="qty"><button data-action="cart-minus" data-i="${i}">−</button><b>${c.qty}</b><button data-action="cart-plus" data-i="${i}">+</button></div><b>${money(c.price*c.qty)}</b><button class="actions del" data-action="cart-remove" data-i="${i}"><i class="fa-solid fa-xmark"></i></button></div>`).join('')+`<hr><div class="field"><label>Discount</label><input id="cartDiscount" type="number" min="0" value="${window.cartDiscount||0}"></div><div class="cart-total"><span>Subtotal</span><b>${money(cartTotal())}</b></div><div class="cart-total"><span>Grand total</span><b>${money(cartTotal()-Number(window.cartDiscount||0))}</b></div><button class="btn" style="width:100%;justify-content:center;margin-top:10px" data-action="checkout">Complete sale</button>`:empty('fa-cart-shopping','Cart is empty')}</div></div>`}
function cartTotal(){return sum(cart,x=>x.qty*x.price)}
function expenses(){let arr=db.expenses.filter(x=>!window.expQ||Object.values(x).join(' ').toLowerCase().includes(window.expQ.toLowerCase()));return pageHead('Expenses','Track operating costs and keep profit accurate.',`<button class="btn" data-action="expense-form"><i class="fa-solid fa-plus"></i> Add expense</button>`)+`<div class="cards"><div class="stat"><span class="label">Today</span><strong>${money(sum(db.expenses.filter(x=>isToday(x.date)),x=>x.amount))}</strong></div><div class="stat"><span class="label">This month</span><strong>${money(sum(db.expenses.filter(x=>(x.date||'').slice(0,7)===today().slice(0,7)),x=>x.amount))}</strong></div><div class="stat"><span class="label">All expenses</span><strong>${money(sum(db.expenses,x=>x.amount))}</strong></div></div><div class="panel"><div class="search-row"><div class="search"><i class="fa-solid fa-search"></i><input data-search="expenses" value="${esc(window.expQ||'')}" placeholder="Search expenses..."></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Expense</th><th>Category</th><th>Date</th><th>Method</th><th>Amount</th><th></th></tr></thead><tbody>${arr.length?arr.map(x=>`<tr><td><b>${esc(x.name)}</b><br><small>${esc(x.note||'')}</small></td><td>${esc(x.category)}</td><td>${date(x.date)}</td><td>${esc(x.method)}</td><td>${money(x.amount)}</td><td><div class="actions"><button data-action="expense-edit" data-id="${x.id}"><i class="fa-solid fa-pen"></i></button><button class="del" data-action="expense-delete" data-id="${x.id}"><i class="fa-solid fa-trash"></i></button></div></td></tr>`).join(''):`<tr><td colspan="6">${empty('fa-receipt','No expenses found')}</td></tr>`}</tbody></table></div></div>`}
function searchPage(){let q=(window.itemQ||'').toLowerCase(),arr=db.items.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q));return pageHead('Item Search','Find stock instantly by name, SKU, box, rack or location.')+`<div class="panel"><div class="search"><i class="fa-solid fa-location-dot"></i><input autofocus data-search="item" value="${esc(window.itemQ||'')}" placeholder="Try Needle, B-12, R-03 or Shop Room..."></div></div><div class="cards">${arr.map(x=>`<div class="panel"><div class="panel-title"><h2>${esc(x.name)}</h2><span class="tag">${x.stock} ${esc(x.unit||'pcs')}</span></div><p class="sub">SKU: ${esc(x.code||'-')} · ${esc(x.category||'-')} · ${esc(x.brand||'-')}</p><div class="mini-grid" style="margin-top:12px"><div class="mini"><span>Box</span><b>${esc(x.box||'-')}</b></div><div class="mini"><span>Rack</span><b>${esc(x.rack||'-')}</b></div><div class="mini"><span>Location</span><b>${esc(x.location||'-')}</b></div><div class="mini"><span>Sell</span><b>${money(x.selling)}</b></div></div></div>`).join('')||empty('fa-magnifying-glass','No matching item')}</div>`}
function companyDue(id){let c=db.companies.find(x=>x.id===id);return c?sum(db.sales.filter(x=>x.companyId===id),x=>x.due)-sum(db.payments.filter(x=>x.companyId===id),x=>x.amount):0}function due(){return pageHead('Due List','Company accounts, balances and payment history.',`<button class="btn" data-action="company-form"><i class="fa-solid fa-plus"></i> Add company</button>`)+`<div class="cards">${db.companies.map(c=>`<div class="panel" data-action="company-view" data-id="${c.id}" style="cursor:pointer"><div class="panel-title"><h2>${esc(c.name)}</h2><i class="fa-solid fa-chevron-right"></i></div><p class="sub">${esc(c.phone||'No phone')}</p><div class="mini-grid" style="margin-top:12px"><div class="mini"><span>Total</span><b>${money(sum(db.sales.filter(x=>x.companyId===c.id),x=>x.total))}</b></div><div class="mini"><span>Paid</span><b>${money(sum(db.payments.filter(x=>x.companyId===c.id),x=>x.amount))}</b></div><div class="mini"><span>Due</span><b class="due">${money(companyDue(c.id))}</b></div></div></div>`).join('')||empty('fa-building','No companies added')}</div>`}
function customers(){return pageHead('Customers','Manage customers and their purchase history.',`<button class="btn" data-action="customer-form"><i class="fa-solid fa-plus"></i> Add customer</button>`)+`<div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Company</th><th>Phone</th><th>Purchase</th><th>Due</th><th></th></tr></thead><tbody>${db.customers.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.company||'-')}</td><td>${esc(c.phone||'-')}</td><td>${money(c.total||0)}</td><td class="due">${money(c.due||0)}</td><td><div class="actions"><button data-action="customer-edit" data-id="${c.id}"><i class="fa-solid fa-pen"></i></button><button class="del" data-action="customer-delete" data-id="${c.id}"><i class="fa-solid fa-trash"></i></button></div></td></tr>`).join('')||`<tr><td colspan="6">${empty('fa-users','No customers found')}</td></tr>`}</tbody></table></div></div>`}
function reports(){let rev=sum(db.sales,x=>x.total),cost=sum(db.sales,x=>x.cost||0),ex=sum(db.expenses,x=>x.amount);return pageHead('Reports','Business performance and financial summaries.',`<button class="btn secondary" data-action="print"><i class="fa-solid fa-print"></i> Print</button>`)+`<div class="cards"><div class="stat"><span class="label">Sales revenue</span><strong>${money(rev)}</strong></div><div class="stat"><span class="label">Cost of goods</span><strong>${money(cost)}</strong></div><div class="stat"><span class="label">Expenses</span><strong>${money(ex)}</strong></div><div class="stat"><span class="label">Net profit</span><strong class="profit">${money(rev-cost-ex)}</strong></div></div><div class="grid2"><div class="panel"><h2>Sales report</h2>${reportRows(db.sales,'invoice','customerName','total','date')}</div><div class="panel"><h2>Expense report</h2>${reportRows(db.expenses,'name','category','amount','date')}</div></div><div class="panel"><h2>Stock valuation</h2><div class="table-wrap"><table class="table"><thead><tr><th>Item</th><th>Stock</th><th>Purchase value</th><th>Selling value</th></tr></thead><tbody>${db.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.stock}</td><td>${money(x.stock*x.purchase)}</td><td>${money(x.stock*x.selling)}</td></tr>`).join('')}</tbody></table></div></div>`}function reportRows(a,a1,a2,a3,a4){return `<div class="table-wrap"><table class="table"><thead><tr><th>${a1}</th><th>${a2}</th><th>Amount</th><th>Date</th></tr></thead><tbody>${a.slice(-8).reverse().map(x=>`<tr><td>${esc(x[a1])}</td><td>${esc(x[a2]||'')}</td><td>${money(x[a3])}</td><td>${date(x[a4])}</td></tr>`).join('')||'<tr><td colspan="4">No data</td></tr>'}</tbody></table></div>`}
function settings(){let s=db.settings;return pageHead('Settings','Business profile, data safety and preferences.')+`<div class="grid2"><div class="panel"><h2>Business profile</h2><form id="settingsForm"><div class="form-grid"><div class="field"><label>Business name *</label><input name="businessName" required value="${esc(s.businessName)}"></div><div class="field"><label>Owner name</label><input name="ownerName" value="${esc(s.ownerName)}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(s.phone)}"></div><div class="field"><label>Currency</label><input name="currency" value="${esc(s.currency)}"></div><div class="field"><label>Invoice prefix</label><input name="invoicePrefix" value="${esc(s.invoicePrefix)}"></div><div class="field"><label>Low stock threshold</label><input type="number" min="0" name="lowStockThreshold" value="${s.lowStockThreshold}"></div></div><div class="field" style="margin-top:12px"><label>Address</label><textarea name="address">${esc(s.address)}</textarea></div><button class="btn" style="margin-top:14px">Save settings</button></form></div><div class="panel"><h2>Backup & restore</h2><p class="sub">Your data is stored locally in this browser.</p><div style="display:flex;flex-wrap:wrap;gap:9px;margin-top:15px"><button class="btn secondary" data-action="export"><i class="fa-solid fa-download"></i> Export JSON</button><button class="btn secondary" data-action="import"><i class="fa-solid fa-upload"></i> Import JSON</button><button class="btn secondary" data-action="demo"><i class="fa-solid fa-wand-magic-sparkles"></i> Load demo data</button><button class="btn danger" data-action="clear"><i class="fa-solid fa-trash"></i> Clear all data</button></div></div></div>`}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBg').classList.add('open')}function closeModal(){document.getElementById('modalBg').classList.remove('open');editing=null}
function form(title,fields,action,id=''){openModal(`<div class="modal-head"><h2>${title}</h2><button class="close" data-action="close"><i class="fa-solid fa-xmark"></i></button></div><form id="modalForm" data-form="${action}" data-id="${id}"><div class="form-grid">${fields}</div><div class="form-actions"><button type="button" class="btn secondary" data-action="close">Cancel</button><button class="btn">Save</button></div></form>`)}function inp(name,label,value='',type='text',required=false,extra=''){return `<div class="field"><label>${label}${required?' *':''}</label><input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${extra}></div>`}function sel(name,label,opts,value=''){return `<div class="field"><label>${label}</label><select name="${name}">${opts.map(x=>`<option ${x===value?'selected':''}>${x}</option>`).join('')}</select></div>`}
function itemForm(id){let x=db.items.find(x=>x.id===id)||{};form(id?'Edit item':'Add item',[inp('name','Item name',x.name,'text',true),inp('code','Item code / SKU',x.code||'','text',true),inp('category','Category',x.category),inp('brand','Brand',x.brand),inp('unit','Unit',x.unit||'pcs'),inp('purchase','Purchase price',x.purchase||0,'number',true,'min="0" step="0.01"'),inp('selling','Selling price',x.selling||0,'number',true,'min="0" step="0.01"'),inp('stock','Current stock',x.stock||0,'number',true,'min="0"'),inp('minimum','Minimum stock',x.minimum||db.settings.lowStockThreshold,'number',false,'min="0"'),inp('box','Box number',x.box),inp('rack','Rack number',x.rack),inp('location','Location',x.location),inp('supplier','Supplier',x.supplier),inp('image','Product image URL',x.image),`<div class="field" style="grid-column:1/-1"><label>Notes</label><textarea name="notes">${esc(x.notes||'')}</textarea></div>`],'item',id)}
function companyForm(id){let x=db.companies.find(x=>x.id===id)||{};form(id?'Edit company':'Add company',[inp('name','Company name',x.name,'text',true),inp('contact','Contact person',x.contact),inp('phone','Phone',x.phone),inp('email','Email',x.email,'email'),inp('address','Address',x.address),`<div class="field" style="grid-column:1/-1"><label>Notes</label><textarea name="notes">${esc(x.notes||'')}</textarea></div>`],'company',id)}function customerForm(id){let x=db.customers.find(x=>x.id===id)||{};form(id?'Edit customer':'Add customer',[inp('name','Customer name',x.name,'text',true),inp('company','Company',x.company),inp('phone','Phone',x.phone),inp('address','Address',x.address)],'customer',id)}function expenseForm(id){let x=db.expenses.find(x=>x.id===id)||{};form(id?'Edit expense':'Add expense',[inp('name','Expense name',x.name,'text',true),sel('category','Category',['Transport','Electricity','Shop','Salary','Food','Delivery','Purchase Related','Other'],x.category),inp('amount','Amount',x.amount||0,'number',true,'min="0" step="0.01"'),inp('date','Date',x.date||today(),'date',true),sel('method','Payment method',['Cash','Bank','bKash','Nagad','Rocket','Other'],x.method),`<div class="field" style="grid-column:1/-1"><label>Note</label><textarea name="note">${esc(x.note||'')}</textarea></div>`],'expense',id)}
function stockForm(id){let x=db.items.find(x=>x.id===id);form('Add stock',[sel('itemId','Item',[...db.items.map(i=>i.name)],x?.name||''),inp('qty','Quantity',0,'number',true,'min="1"'),inp('purchase','Purchase price',x?.purchase||0,'number',false,'min="0"'),inp('box','Box number',x?.box),inp('rack','Rack number',x?.rack),inp('location','Location',x?.location),inp('supplier','Supplier',x?.supplier),inp('date','Date',today(),'date'),`<div class="field" style="grid-column:1/-1"><label>Notes</label><textarea name="notes"></textarea></div>`],'stock',id)}
function checkout(){if(!cart.length)return;openModal(`<div class="modal-head"><h2>Complete sale</h2><button class="close" data-action="close">×</button></div><form id="modalForm" data-form="checkout"><div class="form-grid">${sel('customerId','Customer',['Walk-in',...db.customers.map(x=>x.name)])}${sel('companyId','Company',['None',...db.companies.map(x=>x.name)])}${inp('paid','Paid amount',cartTotal()-Number(window.cartDiscount||0),'number',true,'min="0"')}${sel('method','Payment method',['Cash','Bank','bKash','Nagad','Rocket','Other'])}</div><p class="sub" style="margin-top:12px">Total: <b>${money(cartTotal()-Number(window.cartDiscount||0))}</b></p><div class="form-actions"><button type="button" class="btn secondary" data-action="close">Cancel</button><button class="btn green">Save sale</button></div></form>`)}
function companyView(id){let c=db.companies.find(x=>x.id===id), tx=[...db.sales.filter(x=>x.companyId===id).map(x=>({date:x.date,type:'Invoice',desc:x.invoice,debit:x.due,credit:0})),...db.payments.filter(x=>x.companyId===id).map(x=>({date:x.date,type:'Payment',desc:x.reference||'Payment',debit:0,credit:x.amount}))].sort((a,b)=>a.date.localeCompare(b.date));let balance=0;openModal(`<div class="modal-head"><h2>${esc(c.name)}</h2><button class="close" data-action="close">×</button></div><p class="sub">${esc(c.contact||'')} · ${esc(c.phone||'')}</p><div class="mini-grid" style="margin:15px 0"><div class="mini"><span>Total invoice</span><b>${money(sum(db.sales.filter(x=>x.companyId===id),x=>x.total))}</b></div><div class="mini"><span>Paid</span><b>${money(sum(db.payments.filter(x=>x.companyId===id),x=>x.amount))}</b></div><div class="mini"><span>Current due</span><b class="due">${money(companyDue(id))}</b></div></div><button class="btn" data-action="payment-form" data-id="${id}"><i class="fa-solid fa-plus"></i> Payment</button><h3>Transaction history</h3><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Debit</th><th>Credit</th><th>Balance</th></tr></thead><tbody>${tx.map(x=>{balance+=x.debit-x.credit;return `<tr><td>${date(x.date)}</td><td>${x.type}</td><td>${esc(x.desc)}</td><td>${money(x.debit)}</td><td>${money(x.credit)}</td><td>${money(balance)}</td></tr>`}).join('')||'<tr><td colspan="6">No transactions</td></tr>'}</tbody></table></div>`)}
function paymentForm(id){let duev=companyDue(id),c=db.companies.find(x=>x.id===id);form(`Payment · ${c.name}`,[inp('amount','Amount',duev,'number',true,`min="0" max="${duev}" step="0.01"`),inp('date','Payment date',today(),'date',true),sel('method','Payment method',['Cash','Bank','bKash','Nagad','Rocket','Other']),inp('reference','Reference number'),`<div class="field" style="grid-column:1/-1"><label>Note</label><textarea name="note"></textarea></div>`],'payment',id)}
function demo(){if(db.items.length&&!confirm('Replace current data with demo data?'))return;let names=['Needle','Slip Paper','Office File','Plastic File','Envelope','Board Marker','Machine Oil','Thinner'],co=['Rahim Garments','Alif Garments','Tonni Garments','Liza Garments'];db=structuredClone(blank);db.items=names.map((n,i)=>({id:uid('itm'),name:n,code:'SKU-'+(100+i),category:i<2?'Sewing':'Office',brand:'BizFlow',unit:'pcs',purchase:60+i*15,selling:70+i*18,stock: i===0?750:150+i*45,minimum:40,box:'B-'+(12+i),rack:'R-0'+(3+i),location:'Shop Room',supplier:'Local Supplier',createdAt:Date.now()}));db.companies=co.map((n,i)=>({id:uid('co'),name:n,contact:'Manager',phone:'0171100000'+i,address:'Dhaka'}));db.customers=[{id:uid('cus'),name:'Walk-in Retail',company:'',phone:'',total:0,due:0}];db.expenses=[{id:uid('exp'),name:'Shop rent',category:'Shop',amount:12000,date:today(),method:'Bank',note:'Monthly rent'}];save();render();toast('Demo data loaded successfully')}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='bizflow-backup-'+today()+'.json';a.click();toast('Backup exported')}function importData(){document.getElementById('importFile').click()}
function handleForm(f){let fd=new FormData(f),o=Object.fromEntries(fd.entries()),id=f.dataset.id;if(f.dataset.form==='item'){let duplicate=db.items.find(x=>x.code===o.code&&x.id!==id);if(duplicate)return toast('Item code already exists');let x={...(db.items.find(x=>x.id===id)||{}),...o,id:id||uid('itm'),purchase:+o.purchase,selling:+o.selling,stock:+o.stock,minimum:+o.minimum,createdAt:Date.now()};if(!id)db.items.push(x);else db.items=db.items.map(y=>y.id===id?x:y);toast('Item saved')}else if(f.dataset.form==='stock'){let item=db.items.find(x=>x.name===o.itemId);if(!item)return toast('Select an item');item.stock+=+o.qty;Object.assign(item,{box:o.box,rack:o.rack,location:o.location,supplier:o.supplier});db.stockTransactions.push({id:uid('st'),itemId:item.id,qty:+o.qty,type:'in',date:o.date,notes:o.notes});toast('Stock added')}else if(f.dataset.form==='company'){if(db.companies.some(x=>x.name.toLowerCase()===o.name.toLowerCase()&&x.id!==id))return toast('Company already exists');let x={...(db.companies.find(x=>x.id===id)||{}),...o,id:id||uid('co')};if(!id)db.companies.push(x);else db.companies=db.companies.map(y=>y.id===id?x:y);toast('Company saved')}else if(f.dataset.form==='customer'){let x={...(db.customers.find(x=>x.id===id)||{}),...o,id:id||uid('cus')};if(!id)db.customers.push(x);else db.customers=db.customers.map(y=>y.id===id?x:y);toast('Customer saved')}else if(f.dataset.form==='expense'){let x={...(db.expenses.find(x=>x.id===id)||{}),...o,id:id||uid('exp'),amount:+o.amount};if(!id)db.expenses.push(x);else db.expenses=db.expenses.map(y=>y.id===id?x:y);toast('Expense saved')}else if(f.dataset.form==='payment'){let amount=+o.amount;if(amount>companyDue(id))return toast('Payment cannot exceed current due');db.payments.push({id:uid('pay'),companyId:id,amount,date:o.date,method:o.method,reference:o.reference,note:o.note});toast('Payment recorded')}else if(f.dataset.form==='checkout'){let total=cartTotal()-Number(window.cartDiscount||0),paid=+o.paid;if(paid>total)return toast('Paid amount cannot exceed total');let company=db.companies.find(x=>x.name===o.companyId),customer=db.customers.find(x=>x.name===o.customerId),invoice=(db.settings.invoicePrefix||'INV')+'-'+String(db.sales.length+1).padStart(4,'0'),cost=sum(cart,x=>x.qty*x.purchase);cart.forEach(c=>{let it=db.items.find(x=>x.id===c.id);it.stock-=c.qty;db.saleItems.push({saleId:invoice,itemId:c.id,qty:c.qty,price:c.price})});let sale={id:uid('sale'),invoice,date:today(),customerId:customer?.id,customerName:customer?.name||'Walk-in',companyId:company?.id,total,discount:+window.cartDiscount||0,paid,due:total-paid,cost};db.sales.push(sale);if(company&&paid)db.payments.push({id:uid('pay'),companyId:company.id,amount:paid,date:today(),method:o.method,reference:invoice,note:'Sale payment'});if(customer){customer.total=(customer.total||0)+total;customer.due=(customer.due||0)+sale.due}cart=[];window.cartDiscount=0;toast(`Sale ${invoice} completed`)}db.settings.updatedAt=Date.now();save();closeModal();render()}
function click(e){let b=e.target.closest('[data-view]');if(b){view=b.dataset.view;render();return}let a=e.target.closest('[data-action]');if(!a)return;let id=a.dataset.id;switch(a.dataset.action){case'close':closeModal();break;case'item-form':itemForm();break;case'item-edit':itemForm(id);break;case'item-delete':if(confirm('Delete this item?')){db.items=db.items.filter(x=>x.id!==id);save();render();toast('Item deleted')}break;case'stock-add':stockForm(id);break;case'company-form':companyForm();break;case'company-view':companyView(id);break;case'company-edit':companyForm(id);break;case'customer-form':customerForm();break;case'customer-edit':customerForm(id);break;case'customer-delete':if(confirm('Delete customer?')){db.customers=db.customers.filter(x=>x.id!==id);save();render()}break;case'expense-form':expenseForm();break;case'expense-edit':expenseForm(id);break;case'expense-delete':if(confirm('Delete expense?')){db.expenses=db.expenses.filter(x=>x.id!==id);save();render();toast('Expense deleted')}break;case'payment-form':paymentForm(id);break;case'cart-add':{let x=db.items.find(x=>x.id===id),c=cart.find(x=>x.id===id);if(c){if(c.qty<x.stock)c.qty++}else cart.push({...x,qty:1});render();break}case'cart-plus':if(cart[a.dataset.i].qty<db.items.find(x=>x.id===cart[a.dataset.i].id).stock)cart[a.dataset.i].qty++;render();break;case'cart-minus':cart[a.dataset.i].qty--;if(cart[a.dataset.i].qty<1)cart.splice(a.dataset.i,1);render();break;case'cart-remove':cart.splice(a.dataset.i,1);render();break;case'clear-cart':cart=[];window.cartDiscount=0;render();break;case'checkout':checkout();break;case'demo':demo();break;case'export':exportData();break;case'import':importData();break;case'clear':if(confirm('Clear ALL saved data? This cannot be undone.')){if(confirm('Confirm again to permanently delete everything.')){localStorage.removeItem(KEY);db=load();render();toast('All data cleared')}}break;case'print':window.print();break;case'global-search':view='search';render();break}}
document.addEventListener('click',click);document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='settingsForm'){let o=Object.fromEntries(new FormData(e.target));db.settings={...db.settings,...o,lowStockThreshold:+o.lowStockThreshold};save();render();toast('Settings saved')}else if(e.target.id==='modalForm')handleForm(e.target)});document.addEventListener('input',e=>{if(e.target.dataset.search){let k=e.target.dataset.search,q=e.target.value;if(k==='stock')window.stockQ=q;if(k==='pos')window.posQ=q;if(k==='expenses')window.expQ=q;if(k==='item')window.itemQ=q;render()}if(e.target.id==='cartDiscount'){window.cartDiscount=e.target.value;render()}});document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal()});document.getElementById('importFile').addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.items||!x.settings)throw Error();db={...blank,...x};save();render();toast('Backup restored')}catch(err){toast('Invalid backup file')}};r.readAsText(file)});render();
</script></body></html>
